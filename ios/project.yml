name: ArcadiaStudio
options:
  bundleIdPrefix: com.cruyfford
  deploymentTarget:
    iOS: "16.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.19
targets:
  ArcadiaStudio:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    dependencies:
      - package: ZIPFoundation
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Arcadia Studio
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [IBMPlexSansArabic-SemiBold.ttf]
        UIUserInterfaceStyle: Dark
        CFBundleDevelopmentRegion: ar
        NSLocalNetworkUsageDescription: الاتصال بجهاز PS3 في شبكتك (webMAN و FTP)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.cruyfford.arcadia
            UTTypeDescription: Arcadia Store Project
            UTTypeConformsTo: [public.data, public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [arcadia]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Arcadia Store Project
            LSHandlerRank: Owner
            LSItemContentTypes: [com.cruyfford.arcadia]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cruyfford.arcadiastudio
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
