name: PS3 test builds (fresh toolchain)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ps3test/**', 'ps3font/**', '.github/workflows/ps3fresh.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PS3DEV: /usr/local/ps3dev
      PSL1GHT: /usr/local/ps3dev
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex libelf-dev libgmp-dev libmpfr-dev libmpc-dev \
            libncurses-dev libssl-dev zlib1g-dev python3 python-is-python3 pkg-config texinfo wget git
      - name: Toolchain (ps3dev/ps3toolchain nightly)
        run: |
          tag=$(gh release list -R ps3dev/ps3toolchain -L 1 --json tagName -q '.[0].tagName')
          echo "toolchain release: $tag"
          gh release download "$tag" -R ps3dev/ps3toolchain -p '*linux*X64*.tar.gz' -D /tmp/tc
          sudo mkdir -p /usr/local && sudo tar -xzf /tmp/tc/*.tar.gz -C /usr/local
          sudo chown -R $USER /usr/local/ps3dev
          echo "$PS3DEV/bin" >> $GITHUB_PATH; echo "$PS3DEV/ppu/bin" >> $GITHUB_PATH; echo "$PS3DEV/spu/bin" >> $GITHUB_PATH
      - name: PSL1GHT (master)
        run: |
          git clone --depth 1 https://github.com/ps3dev/PSL1GHT /tmp/psl1ght
          cd /tmp/psl1ght && make install-ctrl && make && make install
      - name: tiny3d
        run: |
          mkdir -p $PS3DEV/portlibs/ppu/include $PS3DEV/portlibs/ppu/lib
          git clone --depth 1 https://github.com/wargio/tiny3d /tmp/tiny3d
          cd /tmp/tiny3d/lib && make && make install || (cd /tmp/tiny3d && make -C lib install)
          ls $PS3DEV/portlibs/ppu/lib | grep -i tiny3d
      - name: Build test PKGs
        run: |
          cd ps3test && make pkg TEST_LIBS=0 && cd ..
          cd ps3font && make pkg && cd ..
          cp ps3test/ARCTEST0.pkg ARCADIA_Test_A2.pkg
          cp ps3font/ARCFONT.pkg ARCADIA_Arabic_Font2.pkg
      - name: Release
        run: |
          gh release delete ps3fresh-latest -y --cleanup-tag || true
          gh release create ps3fresh-latest ARCADIA_Test_A2.pkg ARCADIA_Arabic_Font2.pkg -t "PS3 fresh-toolchain tests" -n "Built from ${{ github.sha }}"
