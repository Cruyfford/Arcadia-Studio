name: PS3 App
on:
  push:
    paths: ['ps3app/**', 'ps3font/**', '.github/workflows/ps3app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build PKG
        env: { RAWG_KEY: '${{ secrets.RAWG_KEY }}' }
        run: |
          echo "RAWG key present: $([ -n "$RAWG_KEY" ] && echo yes || echo no)"
          docker run --rm -e RAWG_KEY -v $PWD/ps3app:/src -w /src hldtux/ps3dev:latest bash -lc 'export PS3DEV=/usr/local/ps3dev PSL1GHT=/usr/local/ps3dev; export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH; make pkg'
          sudo chown -R $USER ps3app
          ls -la ps3app
          cp ps3app/build/pkg/USRDIR/EBOOT.BIN EBOOT.BIN
          docker run --rm -v $PWD/ps3font:/src -w /src hldtux/ps3dev:latest bash -lc 'export PS3DEV=/usr/local/ps3dev PSL1GHT=/usr/local/ps3dev; export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH; make pkg'
          sudo chown -R $USER ps3font
          cp ps3font/ARCFONT.pkg ARCADIA_Arabic_Font.pkg
      - uses: actions/upload-artifact@v4
        with: { name: ARCADIA_EBOOT, path: EBOOT.BIN }
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete ps3app-latest -y --cleanup-tag || true
          gh release create ps3app-latest EBOOT.BIN ARCADIA_Arabic_Font.pkg -t "ARCADIA PS3 App (EBOOT for the store PKG)" -n "Built from ${{ github.sha }}"
