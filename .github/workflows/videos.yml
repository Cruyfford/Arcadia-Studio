name: Game videos
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Make videos
        env:
          RAWG_KEY: ${{ secrets.RAWG_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/make_videos.py ${{ matrix.shard }} 8
