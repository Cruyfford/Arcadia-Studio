name: PS3 app (Apollo's SDK)
# Same toolchain, mbedTLS and cURL builds that Apollo Save Tool uses (known to run on HEN 4.93)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['ps3app/**', 'ps3test/**', '.github/workflows/ps3app_sdk2020.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: SDK
        run: |
          sudo apt-get update && sudo apt-get install -y python2.7
          curl -sL https://github.com/bucanero/ps3toolchain/releases/download/ubuntu-latest-fad3b5fb/ps3dev-ubuntu-latest-2020-08-31.tar.gz | tar xz -C ./
          curl -sL https://github.com/ps3dev/PSL1GHT/raw/master/ppu/include/sysutil/sysutil.h -o ps3dev/ppu/include/sysutil/sysutil.h
          echo "PS3DEV=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          echo "PSL1GHT=${GITHUB_WORKSPACE}/ps3dev" >> $GITHUB_ENV
          ls ps3dev/portlibs/ppu/lib
      - name: mbedTLS
        run: |
          curl -sL https://github.com/Mbed-TLS/mbedtls/releases/download/mbedtls-2.28.10/mbedtls-2.28.10.tar.bz2 | tar xj -C ./
          curl -sL https://github.com/bucanero/ps3libraries/raw/refs/heads/master/patches/mbedtls-2.28.10.patch -o mbedtls.patch
          cd mbedtls-2.28.10 && patch -p1 < ../mbedtls.patch && cd library && chmod +x ps3-build.sh && ./ps3-build.sh
          cp lib*.a $PS3DEV/portlibs/ppu/lib/ && cp -R ../include/mbedtls $PS3DEV/portlibs/ppu/include/
      - name: cURL
        run: |
          curl -sL https://gist.github.com/bucanero/c0b3e143657df54f28e2027abca13c71/raw/e0f879ba4ac6a29f03f024b58084a5fa95ed1a57/curl-ps3-build.sh -o curl-ps3-build.sh
          chmod +x curl-ps3-build.sh && ./curl-ps3-build.sh
      - name: Build
        env: { RAWG_KEY: '${{ secrets.RAWG_KEY }}' }
        run: |
          export PATH=$PS3DEV/bin:$PS3DEV/ppu/bin:$PATH
          cd ps3test && make pkg TEST_LIBS=0 && cd ..
          cd ps3app && make pkg && cd ..
          mkdir out
          cp ps3app/build/pkg/USRDIR/EBOOT.BIN out/EBOOT.BIN
          cp ps3app/pkgfiles/USRDIR/font.ttf out/font.ttf
          cp ps3test/ARCTEST0.pkg out/ARCADIA_Test_C.pkg
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete ps3app-sdk2020 -y --cleanup-tag || true
          gh release create ps3app-sdk2020 out/* -t "ARCADIA app built with Apollo's SDK" -n "Built from ${{ github.sha }}"
