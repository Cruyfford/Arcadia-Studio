name: Build Arcadia Studio (iOS IPA)
on:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project ArcadiaStudio.xcodeproj -scheme ArcadiaStudio -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/ArcadiaStudio.app
      - name: Show errors
        if: failure()
        run: cd ios && grep -E "error:" build.log | head -80
      - name: Package IPA
        run: |
          cd ios && mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/ArcadiaStudio.app Payload/
          zip -qr ArcadiaStudio.ipa Payload && ls -la ArcadiaStudio.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest -y --cleanup-tag || true
          gh release create ios-latest ios/ArcadiaStudio.ipa -t "Arcadia Studio iOS (latest)" -n "Unsigned IPA - built from ${GITHUB_SHA::7}" --prerelease
