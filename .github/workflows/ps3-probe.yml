name: PS3 toolchain probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            cd $PS3DEV/portlibs/ppu
            echo "=== libs"; ls lib | grep -iE "curl|ssl|tls|crypto|polar|mbed|^libz"
            echo "=== pc"; cat lib/pkgconfig/libcurl.pc 2>/dev/null
            echo "=== ver"; grep -E "LIBCURL_VERSION " include/curl/curlver.h
            echo "=== inc"; ls include | grep -iE "ssl|tls|polar|mbed"
            echo "=== thread"; grep -n "sysThreadCreate\|sysThreadExit" $PS3DEV/ppu/include/sys/thread.h | head
            echo "=== ca"; ls $PS3DEV/portlibs/ppu/share 2>/dev/null | head
          '
