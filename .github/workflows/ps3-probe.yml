name: PS3 toolchain probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            cd $PS3DEV
            echo "=== enums"; sed -n "/typedef enum/,/}/p" portlibs/ppu/include/tiny3d.h | grep -v "^\s*//" | head -150
            grep -n "TEXTURE_\|#define" portlibs/ppu/include/tiny3d.h | head -40
            echo "=== pngdec tail"; sed -n 80,400p ppu/include/pngdec/pngdec.h | grep -n "pngData\|pngLoad\|bmp_out\|pitch\|width\|height" | head -30
            echo "=== sysmodule"; grep -n "PNGDEC\|FREETYPE\|NET\b\|SYSUTIL_ID_PNG" ppu/include/sysmodule/sysmodule.h | head
            echo "=== net"; grep -n "netInitialize\|netDeinitialize" -r ppu/include/net/*.h | head
            echo "=== ft"; ls portlibs/ppu/include | head -60; ls portlibs/ppu/include/freetype2 2>/dev/null | head
          '
