name: PS3 toolchain probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Headers
        run: |
          docker run --rm hldtux/ps3dev:latest bash -lc '
            cd $PS3DEV
            echo "=== tiny3d.h"; grep -E "^(int|void|u32|float|void \*|u8|s32|unsigned|typedef|#define TINY3D|extern)" portlibs/ppu/include/tiny3d.h | head -150
            echo "=== pngdec.h"; cat ppu/include/pngdec/pngdec.h | head -80
            echo "=== ppu_rules"; cat ppu_rules
            echo "=== portlibs libs"; ls portlibs/ppu/lib
            echo "=== io/pad.h"; grep -n "BTN_\|ioPad" ppu/include/io/pad.h | head -60
            echo "=== sysutil"; grep -n "SYSUTIL_EXIT\|sysUtilRegisterCallback\|sysUtilCheckCallback" -r ppu/include/sysutil/*.h | head
            find / -path /proc -prune -o -name "*.c" -path "*tiny3d*" -print 2>/dev/null | head -20
          '
