name: Build Arcadia Studio (Windows EXE)
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Smoke test (imports)
        run: python -c "import arcadia_studio.app, arcadia_studio.converter, arcadia_studio.xmb_ui, arcadia_studio.ftp_ui, arcadia_studio.strings_ui, arcadia_studio.history_ui, arcadia_studio.core.fontmerge, arcadia_studio.core.pkginfo, arcadia_studio.core.ps2conv, arcadia_studio.core.ps1conv; print('imports ok')"
      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed --name ArcadiaStudio
          --add-data "arcadia_studio/assets;arcadia_studio/assets"
          --add-data "arcadia_studio/engines;arcadia_studio/engines"
          --hidden-import Crypto.Cipher.AES --hidden-import Crypto.Hash.CMAC
          --hidden-import ecdsa --hidden-import pycdlib --hidden-import requests --hidden-import PIL
          --collect-submodules bidi --collect-data arabic_reshaper --collect-submodules fontTools --collect-data imageio_ffmpeg --hidden-import imageio_ffmpeg --hidden-import PySide6.QtMultimedia
          --icon arcadia_studio/assets/arcadia.ico
          run_studio.py
      - uses: actions/upload-artifact@v4
        with:
          name: ArcadiaStudio-Windows
          path: dist/ArcadiaStudio.exe
      - name: Publish EXE (release + build branch)
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest dist/ArcadiaStudio.exe -t "Arcadia Studio (latest)" -n "Windows EXE - built from ${GITHUB_SHA::7}"
          mkdir out && cp dist/ArcadiaStudio.exe out/ && cd out
          git init -q && git checkout -q -b build
          git -c user.name=ci -c user.email=ci@local add ArcadiaStudio.exe
          git -c user.name=ci -c user.email=ci@local commit -q -m "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build
